name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は 1 本に絞る。走っているデプロイは止めない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 絵の切り出し (tools/slice_sprite.py) は生成物をコミットしてあるので
      # ここでは走らせない。素材を差し替えたときだけ手元で流す。
      - run: npm run build

      # enablement: true で Pages の配信方式を「GitHub Actions」に切り替える。
      # この repo は当初「Deploy from a branch」だったため、これが無いと
      # ビルド結果ではなくリポジトリ直下がそのまま公開されてしまう。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
